# SWAG (nginx) reverse-proxy config for the MCP server.
# Place in: /etc/swag/nginx/proxy-confs/mcp-server.subdomain.conf
#
# Exposes the SSE endpoint at:  https://mcp.<your-domain>/sse
# Claude connection URL:        https://mcp.<your-domain>/sse

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mcp.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 10M;

    # Proxy to MCP server container
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app   mcp-server;
        set $upstream_port  8000;
        set $upstream_proto http;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # SSE-specific settings
        proxy_buffering             off;
        proxy_cache                 off;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding   on;

        # Optional: restrict to VPN subnet (recommended)
        # allow 10.0.0.0/8;
        # deny  all;
    }
}
