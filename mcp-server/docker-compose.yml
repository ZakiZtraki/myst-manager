version: '3.8'

# Standalone compose for the MCP server.
# To integrate with myst-node, copy the mcp-server service block
# into myst-node/docker-compose.yml and add it to the proxy_d network.

services:
  mcp-server:
    build:
      context: ..          # repo root — needs both crypto-portfolio/ and mcp-server/
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped
    env_file: .env
    environment:
      - PORTFOLIO_FILE=/data/portfolio.json
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - USE_BINANCE=${USE_BINANCE:-false}
      - MYST_WALLET_ADDRESS=${MYST_WALLET_ADDRESS:-0x3fade093f91d6bddbdb802c01fab2a949bac3fa6}
    volumes:
      - C:/Users/vlbir/OneDrive/source/myst-manager/crypto-portfolio/portfolio.json:/data/portfolio.json
    ports:
      # Expose locally only; use reverse proxy for HTTPS access
      - "8000:8000"
    networks:
      - mcp_net

  # Uncomment to add to the existing SWAG proxy network instead of standalone:
  # networks:
  #   - proxy_d   # from myst-node/docker-compose.yml

networks:
  mcp_net:
    name: mcp_net
    driver: bridge
